name: Test release policy

on:
  pull_request:
    branches: [main, prerelease]
  push:
    branches: [main, prerelease]

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test branch and source commit restrictions
        run: node --test scripts/verify-release.test.cjs
